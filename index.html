function chatSeed(day,rows){
  return rows.trim().split("\n").map((line,index)=>{
    const p=line.indexOf("|"),en=line.slice(0,p),zh=line.slice(p+1);
    const wrong=CHAT_WRONG[day].has(en);
    const chatReview=CHAT_PASSED[day].has(en)?"passed":CHAT_PENDING[day].has(en)?"pending":wrong?"focus":"none";
    return {id:"d"+day+"-"+(index+1),day,en,zh,wrongCount:wrong?1:0,
      correctCount:0,streak:0,reviewedAt:"",lastResult:"",chatReview,chatSource:"conversation"};
  });
}

function mergeCurriculum(){

  const known=new Set(db.words.map(w=>String(w.day)+":"+String(w.en).toLowerCase()));

    if(!known.has(key)){db.words.push(clone(seed));known.add(key);}

  for(const row of HISTORY){

  }
}

<div class="stats"><div class="stat"><div class="stat-label">✦ 录入词汇</div><b>${db.words.length}</b><small>Day 1–5 已完整收录</small></div><div class="stat"><div class="stat-label">✎ 有过错误的词</div><b>${wrongWords().length}</b><small>累计 ${totalErrors()} 次错误记录</small></div><div class="stat"><div class="stat-label">♡ 站内连对2次</div><b>${mastered()}</b><small>满2次视作站内熟练</small></div><div class="stat"><div class="stat-label">▦ 已打卡天数</div><b>${totalChecked()}</b><small>当前连续 ${streakDays()} 天</small></div></div>

<div class="card"><div class="panel-title"><h3>✉️ 最需要照顾的词</h3><button class="btn plain small" data-action="nav" data-value="words">全部错词 →</button></div><div class="cloud">${weak.map(w=>`<button class="chip" data-action="open-word" data-value="${e(w.id)}">${e(w.en)} <strong>×${w.wrongCount}</strong></button>`).join('')}</div><div class="tip" style="margin-top:18px">😾 Day 4、Day 5 的聊天错词已整理。答对的会退出重点回炉，历史错误次数仍会保留。</div></div></div>

function filteredWords(){let x=pickedDay().filter(w=>{if(wordFilter==='wrong'&&w.wrongCount===0)return false;if(wordFilter==='focus'&&(!w.wrongCount||w.chatReview==='passed'||(w.streak||0)>=2))return false;if(wordFilter==='new'&&(w.correctCount||0)>0||(wordFilter==='new'&&(w.wrongCount||0)>0))return false;if(wordFilter==='mastered'&&(w.streak||0)<2)return false;return !wordSearch||w.en.toLowerCase().includes(wordSearch.toLowerCase())||w.zh.includes(wordSearch)});if(wordSort==='wrong')x.sort((a,b)=>b.wrongCount-a.wrongCount||(a.day-b.day));else if(wordSort==='az')x.sort((a,b)=>a.en.localeCompare(b.en));else x.sort((a,b)=>a.day-b.day||Number(a.id.split('-')[1])-Number(b.id.split('-')[1]));return x;}

function wordCard(w){let show=revealed.has(w.id);return `<article class="wordcard" id="word-${e(w.id)}"><div class="meta"><span class="pill ${w.wrongCount?'rose':'green'}">${w.wrongCount?`犯错 ${w.wrongCount} 次`:'暂无错词记录'}</span><button class="speak" title="播放读音" aria-label="朗读${e(w.en)}" data-action="speak" data-value="${e(w.en)}">♫</button></div><strong class="word">${e(w.en)}</strong><div style="margin:9px 0 12px"><div class="meaning ${show?'':'hidden'}">${show?e(w.zh):'♡ 点击下方按钮翻开释义'}</div></div><div class="tiny" style="margin-bottom:12px">Day ${w.day} · ${w.chatReview==='passed'?'聊天复测已通过 · 待隔日巩固':w.chatReview==='pending'?'聊天即时回炉通过 · 待复测':w.chatReview==='focus'?'聊天记录：待回炉':w.streak>=2?'✓ 站内连对两次':'站内连续答对 '+(w.streak||0)+' 次'}</div><div class="actions"><button class="btn soft small" data-action="flip" data-value="${e(w.id)}">${show?'收起释义':'翻开答案'}</button>${show?`<button class="btn good small" data-action="rate-good" data-value="${e(w.id)}">记住了</button><button class="btn bad small" data-action="rate-bad" data-value="${e(w.id)}">还不会</button>`:''}</div></article>`}
function quizStart(mode=quizMode,day=quizDay){let words=db.words.filter(w=>day==='all'||String(w.day)===day);if(mode==='wrong')words=words.filter(w=>w.wrongCount>0&&(w.streak||0)<2&&w.chatReview!=='passed');if(mode==='new')words=words.filter(w=>w.wrongCount===0&&(w.correctCount||0)===0);if(!words.length){toast('这个范围暂时没有符合条件的单词，换一组吧。');return}let a=words.map(w=>({w,key:mode==='wrong'?-Math.log(Math.max(Math.random(),1e-9))/(1+w.wrongCount*2):Math.random()}));a.sort((x,y)=>x.key-y.key);let ids=a.slice(0,Math.min(10,a.length)).map(x=>x.w.id);quiz={mode,day,ids,at:0,checked:false,answer:'',correct:false,score:0,results:[]};render();}
function quizPage(){if(!quiz){return heading('默写挑战','先选挑战范围。只看中文，自己拼出完整的英文——数学可不能永远只写 math 哦。')+`<div class="card"><div class="sub-title">选择挑战类型</div><div class="quiz-setup">${[['wrong','重点回炉','优先抽查当前未掌握的错词'],['random','随机混合','从指定范围随机抽10个'],['new','全新探索','只抽还没练过的单词']].map(x=>`<button class="choice ${quizMode===x[0]?'selected':''}" data-action="quizmode" data-value="${x[0]}"><strong>${x[1]}</strong>${x[2]}</button>`).join('')}</div><div class="sub-title">单词范围</div><div class="seg" style="margin-bottom:22px">${[['all','全部'],['1','Day 1'],['2','Day 2'],['3','Day 3'],['4','Day 4'],['5','Day 5']].map(x=>`<button class="${quizDay===x[0]?'active':''}" data-action="quizday" data-value="${x[0]}">${x[1]}</button>`).join('')}</div><div class="tip" style="margin-bottom:19px">🐶 每道题都会核对拼写。答错一次就给对应的错词计数 +1，答对一次则增加连续正确次数。答错后会展示正确答案。</div><button class="btn primary" data-action="quiz-start">✎ 开始这轮挑战</button></div>`}
if(quiz.at>=quiz.ids.length){let n=quiz.ids.length;return heading('挑战结算','每一次拼对，都是你自己从记忆里捞出来的。')+`<div class="card" style="text-align:center"><div class="eyebrow">CHALLENGE COMPLETE</div><div class="quiz-result">${Math.round(quiz.score/n*100)}<span style="font-size:20px">分</span></div><p style="color:#a1848b;font-size:13px">${n}题答对 ${quiz.score} 题 · ${quiz.score>=n*0.9?'🐶 你赢啦！':'🌷 错词已经帮你收进小卡片了'}</p><div class="cloud" style="justify-content:center">${quiz.results.filter(r=>!r.correct).map(r=>{let w=wById(r.id);return `<button class="chip" data-action="open-word" data-value="${e(w.id)}">${e(w.en)} ×${w.wrongCount}</button>`}).join('')||'<span class="pill green">完美！本轮没有错词</span>'}</div><div class="row" style="justify-content:center;margin-top:24px"><button class="btn primary" data-action="quiz-again">再来一轮</button><button class="btn outline" data-action="nav" data-value="words">查看错词</button></div></div>`}

function settingsPage(){return heading('资料箱','单词、错词次数、练习和日记都存在当前浏览器里。记得定期导出备份。')+`<div class="twocol"><div class="card"><h3>＋ 添加自己的单词</h3><p class="tiny">可以把之后的新词加进来，自动进入小卡片和挑战题库。</p><label class="field">英文<input id="newEn" placeholder="例如：resilience" autocomplete="off"/></label><label class="field">中文释义<input id="newZh" placeholder="例如：韧性；恢复力"/></label><label class="field">所属单元<select id="newDay"><option value="1">Day 1</option><option value="2">Day 2</option><option value="3">Day 3</option><option value="4">Day 4</option><option value="5">Day 5</option><option value="6">Day 6</option><option value="7">Day 7</option><option value="8">Day 8</option></select></label><button class="btn primary" data-action="add-word">把它加入单词本 ♡</button></div><div class="card"><h3>▤ 批量导入单词</h3><p class="tiny">每行一个，格式：英文 | 中文 | Day数字。已有英文词会自动跳过，不覆盖错词次数。</p><label class="field">复制粘贴词表<textarea id="bulkInput" placeholder="resilience | 韧性；恢复力 | 4&#10;dedicate | 奉献；致力于 | 4"></textarea></label><button class="btn soft" data-action="bulk-import">批量添加</button><div class="divider"></div><div class="tiny">已经预置 Day 1–5 共258词（包含 Day 4、Day 5），也可以继续添加后面的单元。</div></div></div><div class="card section-gap"><h3>✿ 备份与恢复</h3><p class="tiny" style="line-height:1.9">数据只保存在这个网站的当前浏览器中。换设备、清除浏览器数据，或换网址时可能看不到原记录。建议每隔几天导出一次 JSON 备份。</p><div class="row"><button class="btn primary" data-action="export">↓ 导出全部学习记录</button><button class="btn outline" data-action="import">↑ 导入此前备份</button><button class="btn plain" data-action="reset">重置全部数据</button></div><div class="tip" style="margin-top:18px">${hasStorage?'✓ 浏览器本地存储当前可用。':'⚠ 当前浏览器可能限制本地存储，请务必导出备份。'} 这个版本不需要注册账号，也没有云同步功能。</div></div><p class="footer-note">Made for Xiaoluo · 🐶 Sevrin & 🪼 Lorin · 离线单页版，无广告，无数据上传。</p>`}
function render(){const content=view==='home'?home():view==='words'?wordsPage():view==='quiz'?quizPage():view==='calendar'?calendarPage():settingsPage();document.getElementById('app').innerHTML=navTemplate()+`<main class="main">${content}</main>`;if(view==='quiz'&&quiz&&!quiz.checked&&quiz.at<quiz.ids.length){let x=document.getElementById('quizInput');if(x)x.focus({preventScroll:true});}}
function updateWord(id,correct){let w=wById(id);if(!w)return;if(correct){w.correctCount=(w.correctCount||0)+1;w.streak=(w.streak||0)+1;if(w.streak>=2)w.chatReview='passed';}else{w.wrongCount=(w.wrongCount||0)+1;w.streak=0;w.chatReview='focus';}w.reviewedAt=today();w.lastResult=correct?'correct':'wrong';revealed.delete(id);save();toast(correct?`✓ ${w.en} 记住一次！`:`✎ ${w.en} 已记入错词 ×${w.wrongCount}`);render();}
function pronounce(en){if(!('speechSynthesis' in window)){toast('此浏览器暂不支持英语朗读。');return}window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(en);u.lang='en-US';u.rate=.75;u.pitch=1.05;window.speechSynthesis.speak(u)}
function addWord(en,zh,day){en=en.trim().toLowerCase();zh=zh.trim();day=Number(day);if(!/^[a-z][a-z\s-]*$/.test(en)||!zh||!Number.isInteger(day)||day<1||day>99)return '词条格式不正确';if(db.words.some(w=>w.en.toLowerCase()===en))return '这个词已经在词本里了';db.words.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),day,en,zh,wrongCount:0,correctCount:0,streak:0,reviewedAt:'',lastResult:''});return null}
function exportBackup(){const content=JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([content],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`小洛大战四级_学习备份_${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('♡ 备份文件已生成');}
function importBackup(data){if(!data||!Array.isArray(data.words)||!data.words.length||!data.checkins||!Array.isArray(data.sessions))throw Error('不是本站备份文件');for(const w of data.words){if(typeof w.en!=='string'||typeof w.zh!=='string'||!Number.isInteger(Number(w.day))||!Number.isFinite(Number(w.wrongCount))||Number(w.wrongCount)<0)throw Error('备份单词数据损坏');}db={schema:1,words:data.words.map(w=>({...w,wrongCount:Math.max(0,Math.floor(Number(w.wrongCount))),correctCount:Math.max(0,Math.floor(Number(w.correctCount)||0)),streak:Math.max(0,Math.floor(Number(w.streak)||0))})),checkins:data.checkins,sessions:data.sessions.slice(-500),created:data.created||today()};mergeCurriculum();save();revealed.clear();view='home';render();toast('♡ 备份恢复成功');}
document.addEventListener('click',evt=>{let b=evt.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,val=b.dataset.value;
if(action==='nav'){view=val;render();window.scrollTo(0,0)}
else if(action==='open-word'){view='words';wordDay='all';wordFilter='all';wordSearch=wById(val)?.en||'';revealed.add(val);render();window.scrollTo(0,0)}
else if(action==='wordday'){wordDay=val;render()}
else if(action==='wordfilter'){wordFilter=val;render()}
else if(action==='flip'){revealed.has(val)?revealed.delete(val):revealed.add(val);render()}
else if(action==='rate-good')updateWord(val,true);
else if(action==='rate-bad')updateWord(val,false);
else if(action==='speak')pronounce(val);
else if(action==='quizmode'){quizMode=val;render()}
else if(action==='quizday'){quizDay=val;render()}
else if(action==='quiz-start'){quizStart(quizMode,quizDay)}
else if(action==='quiz-check'||action==='quiz-skip'){if(!quiz||quiz.checked)return;quiz.answer=action==='quiz-skip'?'':(document.getElementById('quizInput')?.value||'').trim();const w=wById(quiz.ids[quiz.at]);recordQuiz(quiz.answer.toLowerCase().replace(/\s+/g,' ')===w.en.toLowerCase())}
else if(action==='quiz-next')quizNext();
else if(action==='quiz-again'){quiz=null;render()}
else if(action==='checkin'){let k=today();db.checkins[k]={...(db.checkins[k]||{}),checked:!db.checkins[k]?.checked};save();render();toast(db.checkins[k].checked?'♡ 打卡成功！今天的努力被记下了':'今天的打卡已取消');}
else if(action==='cal-prev'){calOffset--;render()}
else if(action==='cal-next'){calOffset++;render()}
else if(action==='cal-day'){selectedDate=val;render()}
else if(action==='cal-now'){calOffset=0;selectedDate=today();render()}
else if(action==='save-note'){const s=document.getElementById('diaryNote')?.value||'';db.checkins[selectedDate]={...(db.checkins[selectedDate]||{}),note:s.slice(0,3000)};save();render();toast('✉️ 小纸条已经保存');}
else if(action==='add-word'){let err=addWord(document.getElementById('newEn').value,document.getElementById('newZh').value,document.getElementById('newDay').value);if(err){toast(err);return}save();render();toast('♡ 已加入单词本');}
else if(action==='bulk-import'){let raw=document.getElementById('bulkInput').value.split('\n'),added=0,skipped=0;for(const line of raw){if(!line.trim())continue;let pieces=line.split('|');let err=pieces.length>=2?addWord(pieces[0],pieces[1],pieces[2]||'4'):'无效';if(err)skipped++;else added++;}save();render();toast(`添加 ${added} 词，跳过 ${skipped} 行`)}
else if(action==='export')exportBackup();
else if(action==='import')document.getElementById('importFile').click();
else if(action==='reset'){if(confirm('真的要清空站内所有新增记录，并恢复目前预置的258词与对话历史错词吗？此操作无法撤销，请先导出备份。')&&confirm('再确认一次：确定重置吗？')){db=startingData();save();quiz=null;revealed.clear();view='home';render();toast('已恢复初始状态')}}
});
document.addEventListener('input',evt=>{if(evt.target?.id==='quizInput'&&quiz)quiz.answer=evt.target.value;if(evt.target?.id==='wordSearch'){wordSearch=evt.target.value;let s=evt.target.selectionStart;render();let el=document.getElementById('wordSearch');el?.focus({preventScroll:true});el?.setSelectionRange(s,s)}});
document.addEventListener('change',evt=>{if(evt.target.id==='wordSort'){wordSort=evt.target.value;render()}else if(evt.target.id==='importFile'){let f=evt.target.files?.[0];if(!f)return;f.text().then(t=>{const data=JSON.parse(t);if(confirm('导入备份会覆盖当前网站的学习记录。是否继续？'))importBackup(data)}).catch(err=>toast('导入失败：'+err.message));evt.target.value=''}});
document.addEventListener('keydown',evt=>{if(evt.key==='Enter'&&evt.target?.id==='quizInput'){evt.preventDefault();document.querySelector('[data-action="quiz-check"]')?.click()}});
render();
</script>
</body></html>
